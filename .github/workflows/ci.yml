name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  installer:
    name: source installer (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/install_test.py
      - run: python3 scripts/toolchains_test.py
      - name: Verify official private toolchains
        run: |
          set -eu
          . scripts/install-common.sh
          . scripts/toolchains.sh
          prefix="$RUNNER_TEMP/zotigo"
          platform=$(uname -s)
          toolchain_manifest="$PWD/scripts/toolchains.tsv"
          go_version=$(awk '$1=="go" {print $2; exit}' go.mod)
          node_version=$(awk '$1=="node" {print $2; exit}' "$toolchain_manifest")
          pnpm_version=$(awk '$1=="pnpm" {print $2; exit}' "$toolchain_manifest")
          install_tool go "$go_version"
          install_tool node "$node_version"
          node_executable="$prefix/toolchains/node-$node_version/bin/node"
          install_tool pnpm "$pnpm_version"
          "$prefix/toolchains/go-$go_version/bin/go" version
          "$node_executable" "$prefix/toolchains/pnpm-$pnpm_version/bin/pnpm.cjs" --version
      - run: sh install.sh --source "$PWD" --prefix "$RUNNER_TEMP/zotigo" --no-service
      - run: '"$RUNNER_TEMP/zotigo/bin/zotigo" --version'

  check:
    name: gofmt + vet + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt would reformat the following files:"
            echo "$out"
            exit 1
          fi

      # goimports enforces import grouping/sorting. `make check` already runs
      # `goimports -w` locally; this is the read-only counterpart so a PR
      # whose imports drift can't sneak past CI.
      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          out=$(goimports -l .)
          if [ -n "$out" ]; then
            echo "::error::goimports would reformat the following files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      # Match `make test` (Makefile): -race catches concurrency bugs that
      # untraced runs miss. E2E tests are gated behind the `e2e` build tag
      # and need live API keys — we deliberately do not run them in CI.
      - name: go test
        run: go test ./... -count=1 -race -timeout 5m

  windows-hooks:
    name: windows hook process containment
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test hooks
        run: go test ./internal/hooks -count=1 -timeout 5m
